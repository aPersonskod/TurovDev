# working server (comment test http and uncoment everything below)

# HTTP
server{
    listen 80;
    listen [::]:80;
    server_name turoff.dev www.turoff.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS  
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name turoff.dev www.turoff.dev;

    ssl_certificate     /etc/letsencrypt/live/turoff.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/turoff.dev/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # 'backend-api' — это имя сервиса из docker-compose.yml.
        # Docker автоматически разрешает это имя в IP-адрес контейнера.
        # Порт 8080 — это порт, который слушает ASP.NET Core внутри контейнера.
        proxy_pass http://backend-api:8080;

        # Обязательные заголовки для корректной работы приложения за прокси
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Заголовки для передачи реального IP-адреса клиента в ASP.NET Core
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты (опционально, полезно для долгих запросов)
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
    }
    
    location / {
        try_files $uri $uri/ /index.html;
    }
}