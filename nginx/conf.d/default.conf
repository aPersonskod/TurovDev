# test http server
server{
    listen 80;
    server_name turoff.dev www.turoff.dev;

    root /usr/share/nginx/html;
    index index.html;

    # 🔑 ЭТО КЛЮЧЕВОЙ БЛОК ДЛЯ CERTBOT
    # Certbot положит сюда файл-челлендж, а Nginx его отдаст
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # Это важно для SPA: если файл не найден, отдаем index.html
        try_files $uri $uri/ /index.html;
    }
}

