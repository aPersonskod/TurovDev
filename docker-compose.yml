services:
  frontend-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: react-app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Монтируем сертификаты и конфигурацию Nginx с хоста в контейнер
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
        
  backend-api:
    build:
      context: ./SiteAttendanceProj/SiteAttendance.Api
      dockerfile: Dockerfile
    container_name: turoff-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "https://+:8081;http://+:8080"
    depends_on:
      postgres_attendance:
        condition: service_healthy

  postgres_attendance:
    image: postgres:latest
    container_name: turoff-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password  # todo CHANGE IN PROD and appsettings !!!!!!!!!!!!!!!
      POSTGRES_DB: turoff_attendance_db
    volumes:
      - postgres_data:/var/lib/postgresql/18/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    # ports:
    #   - "5432:5432"   # ❌ НЕ публикуем наружу

volumes:
  postgres_data:        # именованный том — данные переживут пересоздание контейнера
  
  
  
